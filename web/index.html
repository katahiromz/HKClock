<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="keywords" content="HK時計,HKClock,HK-Clock,Webアプリ,ウェブアプリ,katahiromz">
<title>HK時計</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #ctxMenu {
    position: fixed;
    z-index: 1000;
    display: none;
    min-width: 220px;
    background: rgba(30, 34, 44, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    padding: 6px;
    font-family: "Segoe UI", "Noto Sans", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #ctxMenu .ctx-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 5px;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    white-space: nowrap;
  }
  #ctxMenu .ctx-item:hover {
    background: rgba(255, 255, 255, 0.12);
  }
  #ctxMenu .ctx-check {
    width: 16px;
    height: 16px;
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 3px;
    flex: 0 0 auto;
    position: relative;
  }
  #ctxMenu .ctx-check.checked::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid #4dd0ff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  #ctxMenu .ctx-sep {
    height: 1px;
    margin: 6px 4px;
    background: rgba(255, 255, 255, 0.15);
  }
  #ctxMenu .ctx-item.ctx-version {
    color: rgba(255, 255, 255, 0.65);
    font-size: 13px;
    cursor: default;
  }
</style>
</head>
<body>
<canvas id="clock"></canvas>
<div id="ctxMenu">
  <div class="ctx-item ctx-version" id="ctxVersionItem">
    <span>HK時計 Version 1.0.1</span>
  </div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" id="ctxSoundItem">
    <span class="ctx-check" id="ctxSoundCheck"></span>
    <span>音声を再生する</span>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');

  function disableZoom() {
    // Disable Ctrl+Wheel
    document.addEventListener('wheel', function(e) {
      if (e.ctrlKey) {
        e.preventDefault();
      }
    }, { passive: false });

    // Disable keyboard zoom
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '0')) {
        e.preventDefault();
      }
    });

    // Disable pinch zoom
    document.addEventListener('touchmove', function(e) {
      if (e.scale !== 1) {
        e.preventDefault();
      }
    }, { passive: false });

    // Disable double-tap zoom
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
  }
  disableZoom();

  // High-DPI support
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // ----- Internet time sync -----
  // Corrects the displayed time against internet time servers.
  //
  // Android Chrome peculiarities this addresses:
  //  1. Network/DNS often not ready at cold start or right after sleep →
  //     aggressive progressive retries + persisted last-good offset.
  //  2. Android may adjust the system wall clock (NITZ/NTP) after the page
  //     has already loaded.  Date.now() then jumps while our stored offset
  //     was computed against the *old* wall clock → displayed time becomes
  //     wrong by the size of the jump.  We detect such discontinuities by
  //     comparing wall-clock advance vs. performance.now() (monotonic) and
  //     immediately invalidate the offset + force a re-sync.
  //  3. Between successful syncs we prefer a monotonic estimate so small
  //     local-clock drift does not accumulate.

  const OFFSET_STORAGE_KEY = 'hkclock_time_offset_ms';
  const JUMP_THRESHOLD_MS = 1500; // wall vs monotonic discrepancy that triggers re-sync
  // After this many consecutive failures without a successful sync in the
  // current session, discard any persisted offset and trust the local clock
  // (user confirmed the device clock itself is accurate).
  const MAX_FAILURES_BEFORE_TRUST_LOCAL = 4;

  let timeOffsetMs = 0;          // serverTime - Date.now() at last successful sync
  let consecutiveFailures = 0;
  let hasSyncedOnce = false;     // true after at least one successful internet sync this session

  // Monotonic baseline used to detect wall-clock jumps and to keep time
  // continuous between syncs.
  let lastWallMs = Date.now();
  let lastPerfMs = performance.now();

  // Track frame interval; a large gap (sleep / background throttle) means
  // the wall clock or offset may no longer be trustworthy → reset.
  let lastDrawPerfMs = performance.now();
  const FRAME_GAP_RESET_MS = 2500; // > ~2.5 s between frames → treat as discontinuity

  function loadPersistedOffset() {
    // Intentionally conservative: we restore a previous offset only as a
    // short-lived hint.  If internet sync does not succeed quickly we
    // discard it (see syncTimeWithInternet / failure path) because a stale
    // offset is worse than the accurate local clock the user confirmed.
    try {
      const v = localStorage.getItem(OFFSET_STORAGE_KEY);
      if (v !== null) {
        const n = parseFloat(v);
        if (isFinite(n) && Math.abs(n) < 30 * 60 * 1000) { // ignore absurd values
          timeOffsetMs = n;
          console.log(`Restored persisted time offset (temporary): ${timeOffsetMs.toFixed(0)} ms`);
        }
      }
    } catch (err) { /* storage unavailable */ }
  }

  function savePersistedOffset(offset) {
    try {
      localStorage.setItem(OFFSET_STORAGE_KEY, String(offset));
    } catch (err) { /* ignore */ }
  }

  function clearPersistedOffset() {
    try {
      localStorage.removeItem(OFFSET_STORAGE_KEY);
    } catch (err) { /* ignore */ }
  }

  loadPersistedOffset();

  // Detect if the system wall clock jumped relative to the monotonic clock.
  // Returns the signed jump size in ms (positive = wall jumped forward),
  // or 0 if no significant jump.
  function detectWallClockJump() {
    const wallNow = Date.now();
    const perfNow = performance.now();
    const wallDelta = wallNow - lastWallMs;
    const perfDelta = perfNow - lastPerfMs;
    // Update baselines always so the next check is relative to now.
    lastWallMs = wallNow;
    lastPerfMs = perfNow;
    const discrepancy = wallDelta - perfDelta;
    if (Math.abs(discrepancy) > JUMP_THRESHOLD_MS) {
      console.log(`Wall-clock jump detected: ${discrepancy.toFixed(0)} ms (wallΔ=${wallDelta.toFixed(0)}, perfΔ=${perfDelta.toFixed(0)})`);
      return discrepancy;
    }
    return 0;
  }

  function nowCorrected() {
    // First, check for a system clock adjustment since the last call.
    const jump = detectWallClockJump();
    if (jump !== 0) {
      // The stored offset was relative to the *old* wall clock.  Invalidate
      // it so we fall back to raw Date.now() (or the next successful sync)
      // instead of showing a permanently wrong time.
      timeOffsetMs = 0;
      hasSyncedOnce = false;
      clearPersistedOffset();
      consecutiveFailures = 0;
      // Kick a re-sync as soon as possible (non-blocking).
      scheduleNextSync(0);
    }
    return new Date(Date.now() + timeOffsetMs);
  }

  // Prefer pure HTTP Date-header sources first: they need no body parse,
  // the Date header is CORS-safelisted (always readable), and the endpoints
  // are highly available on mobile networks. JSON / body-parsing sources
  // come after as higher-precision fallbacks.
  const TIME_SOURCES = [
    {
      name: 'HTTP Date (gstatic)',
      url: 'https://www.gstatic.com/generate_204',
      parse: async (res) => {
        const dateHeader = res.headers.get('date');
        if (!dateHeader) throw new Error('no Date header');
        return new Date(dateHeader).getTime();
      }
    },
    {
      name: 'HTTP Date (Cloudflare)',
      url: 'https://www.cloudflare.com/cdn-cgi/trace',
      parse: async (res) => {
        const dateHeader = res.headers.get('date');
        if (!dateHeader) throw new Error('no Date header');
        return new Date(dateHeader).getTime();
      }
    },
    {
      name: 'HTTP Date (Google)',
      url: 'https://www.google.com/generate_204',
      parse: async (res) => {
        const dateHeader = res.headers.get('date');
        if (!dateHeader) throw new Error('no Date header');
        return new Date(dateHeader).getTime();
      }
    },
    {
      name: 'Cloudflare ts',
      url: 'https://www.cloudflare.com/cdn-cgi/trace',
      parse: async (res) => {
        const text = await res.text();
        const m = text.match(/^ts=([\d.]+)/m);
        if (!m) throw new Error('no ts field');
        return parseFloat(m[1]) * 1000;
      }
    },
    {
      name: 'timeapi.io',
      url: 'https://timeapi.io/api/time/current/zone?timeZone=Etc/UTC',
      parse: async (res) => {
        const data = await res.json();
        return new Date(data.dateTime + 'Z').getTime();
      }
    }
  ];

  function fetchWithTimeout(url, timeoutMs) {
    if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') {
      return fetch(url, { cache: 'no-store', mode: 'cors', signal: AbortSignal.timeout(timeoutMs) });
    }
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    return fetch(url, { cache: 'no-store', mode: 'cors', signal: controller.signal })
      .finally(() => clearTimeout(timer));
  }

  async function trySource(source) {
    const t0 = performance.now();
    const res = await fetchWithTimeout(source.url, 6000);
    if (!res.ok && res.status !== 204) {
      // generate_204 returns 204; treat other non-ok as failure
      // but still try to read Date if present
    }
    const serverTimeMs = await source.parse(res);
    const t1 = performance.now();
    const roundTrip = t1 - t0;
    if (!isFinite(serverTimeMs)) throw new Error('invalid timestamp');
    // Symmetric latency; Date header has ~1 s resolution so RTT compensation
    // is approximate but better than nothing.
    return {
      serverTimeMs: serverTimeMs + roundTrip / 2,
      localTimeAtReceipt: Date.now()
    };
  }

  async function syncTimeWithInternet() {
    const offsets = [];
    for (const source of TIME_SOURCES) {
      try {
        const { serverTimeMs, localTimeAtReceipt } = await trySource(source);
        const off = serverTimeMs - localTimeAtReceipt;
        offsets.push(off);
        console.log(`Internet time sample via ${source.name}: offset ${off.toFixed(0)} ms`);
        // Use the first successful sample immediately so the clock corrects
        // as soon as any source answers; later samples can refine.
        if (!hasSyncedOnce) {
          timeOffsetMs = off;
          savePersistedOffset(timeOffsetMs);
          hasSyncedOnce = true;
          consecutiveFailures = 0;
          lastWallMs = Date.now();
          lastPerfMs = performance.now();
          console.log(`Internet time sync OK (first) via ${source.name}, offset ${timeOffsetMs.toFixed(0)} ms`);
          return true;
        }
      } catch (err) {
        console.log(`Internet time sync failed via ${source.name}:`, err && err.message ? err.message : err);
      }
    }
    if (offsets.length > 0) {
      // Median of successful samples this round (more robust than first).
      offsets.sort((a, b) => a - b);
      const mid = Math.floor(offsets.length / 2);
      const median = offsets.length % 2 ? offsets[mid] : (offsets[mid - 1] + offsets[mid]) / 2;
      timeOffsetMs = median;
      savePersistedOffset(timeOffsetMs);
      consecutiveFailures = 0;
      hasSyncedOnce = true;
      lastWallMs = Date.now();
      lastPerfMs = performance.now();
      console.log(`Internet time sync OK (median of ${offsets.length}), offset ${timeOffsetMs.toFixed(0)} ms`);
      return true;
    }
    consecutiveFailures++;
    // If we still have not succeeded this session and failures pile up,
    // discard any restored/persisted offset and trust the local device
    // clock (confirmed accurate by the user). A stale offset of several
    // minutes is worse than a correct local clock.
    if (!hasSyncedOnce && consecutiveFailures >= MAX_FAILURES_BEFORE_TRUST_LOCAL) {
      if (timeOffsetMs !== 0) {
        console.log(`Discarding unconfirmed offset ${timeOffsetMs.toFixed(0)} ms after ${consecutiveFailures} failures; trusting local clock.`);
        timeOffsetMs = 0;
        clearPersistedOffset();
        try { draw(); } catch (e) { /* may not be defined yet */ }
      }
    }
    console.log('All internet time sources failed, using ' + (hasSyncedOnce ? 'last good offset' : 'local clock') + '.');
    return false;
  }

  // Until we have succeeded at least once this session, keep retrying every
  // few seconds. After success, back off to a long interval.
  const SYNC_INTERVAL_OK_MS = 10 * 60 * 1000;
  const FAIL_BACKOFF_MS = [1000, 1500, 2000, 3000, 4000, 5000, 8000, 15000];
  let syncTimer = null;
  let syncInFlight = false;

  function nextFailDelay() {
    // Never back off beyond 5 s until the first successful sync of the session.
    if (!hasSyncedOnce) {
      return Math.min(FAIL_BACKOFF_MS[Math.min(consecutiveFailures - 1, FAIL_BACKOFF_MS.length - 1)] || 2000, 5000);
    }
    const idx = Math.min(consecutiveFailures - 1, FAIL_BACKOFF_MS.length - 1);
    return FAIL_BACKOFF_MS[Math.max(0, idx)];
  }

  function scheduleNextSync(delayMs) {
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(runSync, delayMs);
  }

  async function runSync() {
    if (syncInFlight) return;
    syncInFlight = true;
    try {
      const ok = await syncTimeWithInternet();
      if (ok) {
        try { draw(); } catch (e) { /* draw may not be defined yet */ }
      }
      scheduleNextSync(ok ? SYNC_INTERVAL_OK_MS : nextFailDelay());
    } finally {
      syncInFlight = false;
    }
  }

  // Start immediately.
  runSync();

  // Continuous rapid attempts for the first 60 s if still not synced.
  let rapidTries = 0;
  const rapidTimer = setInterval(() => {
    rapidTries++;
    if (hasSyncedOnce || rapidTries >= 40) {
      clearInterval(rapidTimer);
      return;
    }
    if (!syncInFlight) runSync();
  }, 1500);

  window.addEventListener('online', () => {
    console.log('Network back online, resyncing time.');
    consecutiveFailures = 0;
    runSync();
  });

  const PI = Math.PI;

  function deg2rad(deg) {
    return deg * PI / 180;
  }

  // Angle from 12-o'clock, clockwise
  function handEndpoint(cx, cy, length, angleDeg) {
    const rad = deg2rad(angleDeg - 90);
    return {
      x: cx + length * Math.cos(rad),
      y: cy + length * Math.sin(rad)
    };
  }

  function dir(angleDeg) {
    const rad = deg2rad(angleDeg - 90);
    return { dx: Math.cos(rad), dy: Math.sin(rad) };
  }

  function draw() {
    // If the interval between frames has jumped (tab was frozen, device
    // slept, Chrome throttled timers, etc.), the stored offset may be
    // stale relative to the current wall clock.  Reset it and force a
    // fresh internet sync so the hands show the correct time immediately.
    const nowPerf = performance.now();
    const frameGap = nowPerf - lastDrawPerfMs;
    lastDrawPerfMs = nowPerf;
    if (frameGap > FRAME_GAP_RESET_MS) {
      console.log(`Frame gap ${frameGap.toFixed(0)} ms – resetting time offset and re-syncing`);
      timeOffsetMs = 0;
      hasSyncedOnce = false;
      clearPersistedOffset();
      consecutiveFailures = 0;
      lastWallMs = Date.now();
      lastPerfMs = performance.now();
      scheduleNextSync(0);
    }

    const clientW = window.innerWidth;
    const clientH = window.innerHeight;

    // Diameter = shorter side
    let diameter = Math.min(clientW, clientH);
    let radius = diameter * 0.5;
    const cx = clientW * 0.5;
    const cy = clientH * 0.5;

    // Slight inset
    const inset = diameter * 0.02;
    radius -= inset;
    diameter = radius * 2;

    // Background - soft blue vertical gradient + stripes
    {
      const grad = ctx.createLinearGradient(0, 0, 0, clientH);
      grad.addColorStop(0, 'rgb(30, 50, 120)');
      grad.addColorStop(0.5, 'rgb(80, 190, 230)');
      grad.addColorStop(1, 'rgb(30, 50, 120)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, clientW, clientH);

      // Subtle vertical stripes
      const stripeStep = 0.06 * radius;
      const lineWidth = 0.02 * radius;
      for (let x = 0; x < clientW; x += stripeStep) {
        const stripeGrad = ctx.createLinearGradient(x, 0, x, clientH);
        stripeGrad.addColorStop(0, 'rgb(94, 200, 255)');
        stripeGrad.addColorStop(1, 'rgb(94, 100, 255)');
        ctx.fillStyle = stripeGrad;
        ctx.fillRect(x, 0, lineWidth, clientH);
      }
    }

    // Outer ring dimensions
    let ringH = Math.min(clientW * 0.77, clientH) * 0.85;
    let ringW = ringH / 0.77;
    const faceR = Math.min(ringW, ringH) / 2 * 0.9;

    // Outer light-blue ring (rim) + shadow
    {
      // Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.31)';
      const shadowWidth = radius * 0.03;
      ctx.beginPath();
      ctx.ellipse(
        cx, cy,
        ringW / 2 + shadowWidth,
        ringH / 2 + shadowWidth,
        0, 0, PI * 2
      );
      ctx.fill();

      // Rim gradient
      const rimGrad = ctx.createLinearGradient(cx, cy - ringH / 2, cx, cy + ringH / 2);
      rimGrad.addColorStop(0, 'rgb(106, 125, 135)');
      rimGrad.addColorStop(0.5, 'rgb(190, 200, 200)');
      rimGrad.addColorStop(1, 'rgb(106, 125, 135)');
      ctx.fillStyle = rimGrad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, ringW / 2, ringH / 2, 0, 0, PI * 2);
      ctx.fill();

      // Inner black face
      ctx.fillStyle = 'rgb(13, 13, 20)';
      ctx.beginPath();
      ctx.arc(cx, cy, faceR, 0, PI * 2);
      ctx.fill();
    }

    // Hour markers (dots) and numbers 12, 3, 6, 9
    {
      const fontSize = faceR * 0.20;
      ctx.font = `900 ${fontSize}px "Arial Black", "Segoe UI", "Noto Sans", Roboto, "SF Pro", system-ui, -apple-system, sans-serif`;
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const labels = ['12', '3', '6', '9'];
      const labelAngles = [0, 90, 180, 270];
      const labelDist = faceR * 0.80;

      for (let i = 0; i < 4; i++) {
        const p = handEndpoint(cx, cy, labelDist, labelAngles[i]);
        ctx.fillText(labels[i], p.x, p.y);
      }

      // Markers
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = faceR * 0.012;
      ctx.fillStyle = '#fff';

      for (let i = 0; i < 60; i++) {
        const angle = i * 6;
        if (i % 5 === 0) {
          // Hour marks: dots
          const dist = faceR * 0.95;
          const p = handEndpoint(cx, cy, dist, angle);
          const r = faceR * 0.04;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, PI * 2);
          ctx.fill();
        } else {
          // Second marks: short radial ticks
          const outer = faceR * 0.98;
          const inner = faceR * 0.91;
          const o = handEndpoint(cx, cy, outer, angle);
          const i_ = handEndpoint(cx, cy, inner, angle);
          ctx.beginPath();
          ctx.moveTo(o.x, o.y);
          ctx.lineTo(i_.x, i_.y);
          ctx.stroke();
        }
      }
    }

    // Current local time (stepped, no continuous sweep)
    const now = nowCorrected();
    let sec = now.getSeconds();
    let min = now.getMinutes();
    let hour = (now.getHours() % 12) + min / 60;

    if (false) {
      min = 51;
      sec = 55;
      hour = 6 + min / 60;
    }

    const secAngle = sec * 6;
    const minAngle = min * 6;
    const hourAngle = hour * 30;

    // ----- Minute hand -----
    {
      const { dx, dy } = dir(minAngle);
      const m1 = dir(minAngle - 1);
      const p1 = dir(minAngle + 1);
      const mm = dir(minAngle - 6);
      const pp = dir(minAngle + 6);
      const mmm = dir(minAngle - 12);
      const ppp = dir(minAngle + 12);
      const mmmm = dir(minAngle - 5);
      const pppp = dir(minAngle + 5);

      const shaftEnd = faceR * 0.9;
      const middle = faceR * 0.25;
      const tail = -faceR * 0.08;

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      // Outer polygon
      ctx.moveTo(cx + shaftEnd * dx, cy + shaftEnd * dy);
      ctx.lineTo(cx + middle * mmm.dx, cy + middle * mmm.dy);
      ctx.lineTo(cx + 0.8 * middle * mm.dx, cy + 0.8 * middle * mm.dy);
      ctx.lineTo(cx + tail * ppp.dx, cy + tail * ppp.dy);
      ctx.lineTo(cx + tail * mmm.dx, cy + tail * mmm.dy);
      ctx.lineTo(cx + 0.8 * middle * pp.dx, cy + 0.8 * middle * pp.dy);
      ctx.lineTo(cx + middle * ppp.dx, cy + middle * ppp.dy);
      ctx.closePath();

      // Inner polygon (alternate fill / hole effect)
      ctx.moveTo(cx + 0.6 * shaftEnd * dx, cy + 0.6 * shaftEnd * dy);
      ctx.lineTo(cx + middle * mmmm.dx, cy + middle * mmmm.dy);
      ctx.lineTo(cx + 0.95 * middle * dx, cy + 0.95 * middle * dy);
      ctx.lineTo(cx + middle * pppp.dx, cy + middle * pppp.dy);
      ctx.closePath();

      ctx.fill('evenodd');

      // Bosses
      const r1 = faceR * 0.08;
      const r2 = faceR * 0.06;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx, cy, r1, 0, PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(cx, cy, r2, 0, PI * 2);
      ctx.fill();
    }

    // ----- Hour hand -----
    {
      const { dx, dy } = dir(hourAngle);
      const m1 = dir(hourAngle - 1);
      const p1 = dir(hourAngle + 1);
      const mm = dir(hourAngle - 5);
      const pp = dir(hourAngle + 5);
      const mmm = dir(hourAngle - 11);
      const ppp = dir(hourAngle + 11);
      const mmmm = dir(hourAngle - 4);
      const pppp = dir(hourAngle + 4);

      const shaftEnd = faceR * 0.6;
      const middle = faceR * 0.3;
      const tail = -faceR * 0.05;

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      // Outer
      ctx.moveTo(cx + shaftEnd * dx, cy + shaftEnd * dy);
      ctx.lineTo(cx + middle * mmm.dx, cy + middle * mmm.dy);
      ctx.lineTo(cx + 0.8 * middle * mm.dx, cy + 0.8 * middle * mm.dy);
      ctx.lineTo(cx + tail * ppp.dx, cy + tail * ppp.dy);
      ctx.lineTo(cx + tail * mmm.dx, cy + tail * mmm.dy);
      ctx.lineTo(cx + 0.8 * middle * pp.dx, cy + 0.8 * middle * pp.dy);
      ctx.lineTo(cx + middle * ppp.dx, cy + middle * ppp.dy);
      ctx.closePath();

      // Inner
      ctx.moveTo(cx + 0.8 * shaftEnd * dx, cy + 0.8 * shaftEnd * dy);
      ctx.lineTo(cx + middle * mmmm.dx, cy + middle * mmmm.dy);
      ctx.lineTo(cx + 0.95 * middle * dx, cy + 0.95 * middle * dy);
      ctx.lineTo(cx + middle * pppp.dx, cy + middle * pppp.dy);
      ctx.closePath();

      ctx.fill('evenodd');

      // Boss
      const r1 = faceR * 0.05;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx, cy, r1, 0, PI * 2);
      ctx.fill();
    }

    // ----- Second hand -----
    {
      const m = dir(secAngle - 0.3);
      const p = dir(secAngle + 0.3);
      const mm = dir(secAngle - 2.5);
      const pp = dir(secAngle + 2.5);

      const shaftEnd = faceR * 0.9;
      const tail = -faceR * 0.3;

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(cx + shaftEnd * m.dx, cy + shaftEnd * m.dy);
      ctx.lineTo(cx + shaftEnd * p.dx, cy + shaftEnd * p.dy);
      ctx.lineTo(cx + tail * mm.dx, cy + tail * mm.dy);
      ctx.lineTo(cx + tail * pp.dx, cy + tail * pp.dy);
      ctx.closePath();
      ctx.fill();

      // Boss
      const r1 = faceR * 0.048;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx, cy, r1, 0, PI * 2);
      ctx.fill();
    }

    // "H K" label (bottom-right)
    {
      const fontSize = faceR * 0.20;
      ctx.font = `900 italic ${fontSize}px "Arial Black", "Segoe UI", "Noto Sans", Roboto, "SF Pro", system-ui, -apple-system, sans-serif`;
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'bottom';
      ctx.fillText('H K', clientW - fontSize * 0.5, clientH - fontSize * 0.5);
    }
  }

  // Update ~5 Hz (same as original 200 ms timer)
  window.addEventListener('resize', resize);
  resize();
  setInterval(draw, 200);

  // ----- Resume from background/sleep -----
  // Android Chrome (and other browsers) throttle or pause setInterval/
  // setTimeout while a tab is hidden or the device is asleep. When the
  // tab becomes visible again, immediately redraw with the current time
  // (instead of waiting for the next throttled tick) and re-sync with
  // the internet time source, since the local clock may have drifted
  // or the device may have been asleep for a while.
  //
  // Also listen for the Page Lifecycle "resume" event (when a frozen
  // page is thawed) which is especially relevant after deep sleep on
  // mobile.
  function handleResume() {
    if (document.visibilityState === 'visible' || document.visibilityState === undefined) {
      // Refresh baselines *before* draw so a jump that occurred while
      // the tab was frozen is detected immediately.
      const jump = detectWallClockJump();
      if (jump !== 0) {
        timeOffsetMs = 0;
        hasSyncedOnce = false;
        clearPersistedOffset();
      }
      draw();
      consecutiveFailures = 0; // allow aggressive retries after wake
      runSync();               // runSync itself redraws on success
    }
  }
  document.addEventListener('visibilitychange', handleResume);
  window.addEventListener('focus', handleResume);
  window.addEventListener('pageshow', handleResume);
  // Page Lifecycle API (supported on modern Chrome / Android)
  document.addEventListener('resume', handleResume);

  // ----- Sound ON/OFF setting (persisted in localStorage) -----
  const SOUND_STORAGE_KEY = 'hkclock_sound_enabled';

  function loadSoundEnabled() {
    try {
      const v = localStorage.getItem(SOUND_STORAGE_KEY);
      return v === 'true'; // default: OFF (false) when not set
    } catch (err) {
      return false;
    }
  }

  function saveSoundEnabled(enabled) {
    try {
      localStorage.setItem(SOUND_STORAGE_KEY, enabled ? 'true' : 'false');
    } catch (err) {
      // ignore (e.g. storage unavailable)
    }
  }

  let soundEnabled = loadSoundEnabled();

  // ----- Context menu -----
  const ctxMenu = document.getElementById('ctxMenu');
  const ctxSoundItem = document.getElementById('ctxSoundItem');
  const ctxSoundCheck = document.getElementById('ctxSoundCheck');

  function updateCtxCheckState() {
    ctxSoundCheck.classList.toggle('checked', soundEnabled);
  }

  function showCtxMenu(x, y) {
    updateCtxCheckState();
    ctxMenu.style.display = 'block';
    const menuW = ctxMenu.offsetWidth;
    const menuH = ctxMenu.offsetHeight;
    const maxX = window.innerWidth - menuW - 4;
    const maxY = window.innerHeight - menuH - 4;
    ctxMenu.style.left = Math.min(x, Math.max(0, maxX)) + 'px';
    ctxMenu.style.top = Math.min(y, Math.max(0, maxY)) + 'px';
  }

  function hideCtxMenu() {
    ctxMenu.style.display = 'none';
  }

  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    showCtxMenu(e.clientX, e.clientY);
  });

  document.addEventListener('click', (e) => {
    if (ctxMenu.style.display === 'block' && !ctxMenu.contains(e.target)) {
      hideCtxMenu();
    }
  });

  window.addEventListener('resize', hideCtxMenu);
  window.addEventListener('scroll', hideCtxMenu);

  ctxSoundItem.addEventListener('click', (e) => {
    e.stopPropagation();
    soundEnabled = !soundEnabled;
    saveSoundEnabled(soundEnabled);
    updateCtxCheckState();
    hideCtxMenu();
  });

  // ----- Second-tick sound -----
  const sound1 = new Audio('1.mp3');
  const sound2 = new Audio('2.mp3');
  const sound3 = new Audio('3.mp3');
  [sound1, sound2, sound3].forEach(a => { a.preload = 'auto'; });

  function playSound(audio) {
    if (!soundEnabled) return;
    const p = audio.play();
    if (p && typeof p.catch === 'function') {
      p.catch((err) => {
        if (err.name !== 'NotAllowedError') {
          console.log(err);
        }
      });
    }
  }

  function tick() {
    const now = nowCorrected();
    const min = now.getMinutes();
    const sec = now.getSeconds();

    if (sec === 0) {
      playSound(sound3);
    } else if (sec >= 57) {
      playSound(sound2);
    } else {
      playSound(sound1);
    }
  }

  function scheduleNextTick() {
    const now = nowCorrected().getTime();
    const delay = 1000 - (now % 1000);
    setTimeout(() => {
      tick();
      scheduleNextTick();
    }, delay);
  }

  scheduleNextTick();
})();
</script>
</body>
</html>
